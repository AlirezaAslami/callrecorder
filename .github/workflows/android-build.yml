name: Build & Sign Android APK / AAB

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      build_bundle:
        description: 'Also build Google Play App Bundle (.aab)'
        required: false
        default: true
        type: boolean

jobs:
  build-android:
    name: Build & Digitally Sign Android App
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📱 Setup Android SDK Licenses (Native GitHub Runner)
        run: |
          echo "Configuring Android SDK licenses on native Ubuntu runner..."
          mkdir -p "$ANDROID_HOME/licenses" || true
          
          # Accept official Android SDK licenses directly into licenses directory
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "84831b9409646a233e8444777c32283657ec44ec" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "84831b9409646a233e8444777c32283657ec44ec" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b64920400829152f320ec45f6c0080944d" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo "e9acab5ab5fbb8d60e1149a3e144d47d45300229" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          echo "d975f751698a77b662f1254ddbeed3901e06dd46" > "$ANDROID_HOME/licenses/intel-android-sysimage-license"
          echo "e6e730866305ac49c2d01602d376295aa60b5358" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          
          echo "Android SDK licenses pre-accepted successfully."

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install NPM Dependencies
        run: |
          echo "Installing NPM dependencies..."
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: 🏗️ Build Web Application Assets (Vite)
        run: |
          npm run build

      - name: 🔄 Sync & Configure Capacitor Android Project
        run: |
          # If android directory is missing full structure, add it
          if [ ! -f "android/build.gradle" ]; then
            echo "Initializing Capacitor Android platform..."
            npx cap add android || true
          fi

          echo "Synchronizing Capacitor Android assets..."
          npx cap sync android

          # Ensure gradlew executable permission or fallback to gradle
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            echo "Gradle wrapper not found, generating wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle || true
            cd android && gradle wrapper || true && cd ..
            chmod +x android/gradlew || true
          fi

      - name: 🔐 Prepare Digital Signing Keystore (Custom or Robust Auto-Generation)
        id: prepare-keystore
        env:
          INPUT_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INPUT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INPUT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore_dir
          KEYSTORE_FILE="keystore_dir/release.keystore"

          if [ -n "$INPUT_KEYSTORE_BASE64" ]; then
            echo "🔑 Secret ANDROID_KEYSTORE_BASE64 found. Decoding custom keystore..."
            echo "$INPUT_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            
            KEYSTORE_PASS="${INPUT_KEYSTORE_PASSWORD:-sadagir123456}"
            ALIAS_NAME="${INPUT_KEY_ALIAS:-sadagir}"
            KEY_PASS="${INPUT_KEY_PASSWORD:-$KEYSTORE_PASS}"
            IS_AUTOGENERATED=false
          else
            echo "⚡ No custom keystore secrets found in repository settings."
            echo "🛡️ Generating a high-security 4096-bit RSA Keystore with SHA256withRSA..."
            
            KEYSTORE_PASS="SadaGir_SecKeystore_2026_KeyPass!"
            ALIAS_NAME="sadagir_release_key"
            KEY_PASS="SadaGir_SecKeystore_2026_KeyPass!"
            IS_AUTOGENERATED=true

            # Generate modern RSA 4096-bit key with 25-year validity (10000 days)
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 4096 \
              -sigalg SHA256withRSA \
              -validity 10000 \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=SadaGir Call Recorder, OU=Mobile Security, O=SadaGir, L=Tehran, ST=Tehran, C=IR"
          fi

          echo "keystore_path=$KEYSTORE_FILE" >> $GITHUB_OUTPUT
          echo "keystore_pass=$KEYSTORE_PASS" >> $GITHUB_OUTPUT
          echo "key_alias=$ALIAS_NAME" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT
          echo "is_autogenerated=$IS_AUTOGENERATED" >> $GITHUB_OUTPUT

      - name: ⚙️ Build Android Release APK
        working-directory: android
        run: |
          echo "Running Gradle assembleRelease..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: 📦 Build Android App Bundle (.aab)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_bundle == true }}
        working-directory: android
        run: |
          echo "Running Gradle bundleRelease..."
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease --stacktrace || true
          else
            gradle bundleRelease --stacktrace || true
          fi

      - name: 🔏 Digitally Sign APK with apksigner (v1 + v2 + v3 + v4 Schemes)
        id: sign-apk
        env:
          KEYSTORE_PATH: ${{ steps.prepare-keystore.outputs.keystore_path }}
          KEYSTORE_PASS: ${{ steps.prepare-keystore.outputs.keystore_pass }}
          KEY_ALIAS: ${{ steps.prepare-keystore.outputs.key_alias }}
          KEY_PASS: ${{ steps.prepare-keystore.outputs.key_pass }}
        run: |
          # Locate built unsigned/release APK
          ORIGINAL_APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            ORIGINAL_APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$ORIGINAL_APK" ]; then
            echo "❌ No compiled APK found in build outputs!"
            exit 1
          fi

          echo "Found compiled APK: $ORIGINAL_APK"
          mkdir -p output_artifacts

          # Locate Android build tools (zipalign and apksigner)
          BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools -type f -name "apksigner" 2>/dev/null | sort -V | tail -n 1 | xargs dirname)
          if [ -n "$BUILD_TOOLS_PATH" ]; then
            ZIPALIGN="$BUILD_TOOLS_PATH/zipalign"
            APKSIGNER="$BUILD_TOOLS_PATH/apksigner"
          else
            ZIPALIGN="zipalign"
            APKSIGNER="apksigner"
          fi

          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"

          ALIGNED_APK="output_artifacts/SadaGir-aligned.apk"
          FINAL_SIGNED_APK="output_artifacts/SadaGir-CallRecorder-Signed-Release.apk"

          # Step 1: 4-byte page-alignment (required by modern Android OS)
          echo "Aligning APK with zipalign..."
          if command -v "$ZIPALIGN" &> /dev/null || [ -f "$ZIPALIGN" ]; then
            "$ZIPALIGN" -v -p 4 "$ORIGINAL_APK" "$ALIGNED_APK"
          else
            cp "$ORIGINAL_APK" "$ALIGNED_APK"
          fi

          # Step 2: Modern Multi-Scheme Signing (v1 Jar + v2 Full APK + v3 Key Rotation + v4 Streaming)
          echo "Signing APK with apksigner (v1, v2, v3, v4)..."
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$FINAL_SIGNED_APK" \
            "$ALIGNED_APK"

          # Step 3: Signature verification check
          echo "Verifying APK Digital Signature..."
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_SIGNED_APK"

          # Clean up intermediate aligned file
          rm -f "$ALIGNED_APK"
          echo "signed_apk_path=$FINAL_SIGNED_APK" >> $GITHUB_OUTPUT

      - name: 🔏 Sign Android App Bundle (AAB) with jarsigner
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_bundle == true }}
        env:
          KEYSTORE_PATH: ${{ steps.prepare-keystore.outputs.keystore_path }}
          KEYSTORE_PASS: ${{ steps.prepare-keystore.outputs.keystore_pass }}
          KEY_ALIAS: ${{ steps.prepare-keystore.outputs.key_alias }}
          KEY_PASS: ${{ steps.prepare-keystore.outputs.key_pass }}
        run: |
          ORIGINAL_AAB=$(find android/app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          if [ -n "$ORIGINAL_AAB" ]; then
            FINAL_SIGNED_AAB="output_artifacts/SadaGir-CallRecorder-Signed-Release.aab"
            cp "$ORIGINAL_AAB" "$FINAL_SIGNED_AAB"

            echo "Signing Android App Bundle (.aab) with jarsigner..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              "$FINAL_SIGNED_AAB" "$KEY_ALIAS"

            echo "Verifying AAB signature..."
            jarsigner -verify -verbose -certs "$FINAL_SIGNED_AAB"
          fi

      - name: 💾 Backup Auto-Generated Keystore (For Future Updates)
        if: ${{ steps.prepare-keystore.outputs.is_autogenerated == 'true' }}
        run: |
          # Create a secure copy of the auto-generated keystore
          cp "${{ steps.prepare-keystore.outputs.keystore_path }}" output_artifacts/autogenerated_keystore_backup.keystore
          
          # Generate base64 string and credentials info
          KEYSTORE_B64=$(base64 -w 0 output_artifacts/autogenerated_keystore_backup.keystore)
          cat << 'EOF' > output_artifacts/KEYSTORE_CREDENTIALS_INFO.txt
          =======================================================
          اطلاعات امضای دیجیتال خودکار (Auto-Generated Keystore)
          =======================================================
          این فایل کلید به صورت خودکار با الگوریتم امنیتی RSA 4096-bit
          و اعتبار ۲۵ ساله برای شما ساخته شد.
          
          مشخصات کلید:
          - Keystore Password: SadaGir_SecKeystore_2026_KeyPass!
          - Key Alias: sadagir_release_key
          - Key Password: SadaGir_SecKeystore_2026_KeyPass!
          - Algorithm: RSA 4096-bit (SHA256withRSA)
          - Schemes: v1 + v2 + v3 + v4 APK Signature Scheme
          
          برای بیلد‌های بعدی، می‌توانید این فایل keystore را نگه دارید
          یا رشته Base64 زیر را در GitHub Secrets با نام
          ANDROID_KEYSTORE_BASE64 ذخیره فرمایید:
          =======================================================
          EOF
          echo "$KEYSTORE_B64" >> output_artifacts/KEYSTORE_CREDENTIALS_INFO.txt

      - name: 📊 Generate Build Summary
        run: |
          echo "### 🚀 نتیجه بیلد و امضای دیجیتال اندروید" >> $GITHUB_STEP_SUMMARY
          echo "- **وضعیت بیلد:** ✅ موفقیت‌آمیز" >> $GITHUB_STEP_SUMMARY
          echo "- **نوع امضا:** 🛡️ RSA 4096-bit (طرح‌های امضای APK v1 + v2 + v3 + v4)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.prepare-keystore.outputs.is_autogenerated }}" = "true" ]; then
            echo "- **منبع کلید:** ⚡ خودکار (Auto-Generated 4096-bit RSA) - نیازی به تنظیم متغیرها نبود!" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **منبع کلید:** 🔑 متغیرهای محرمانه اختصاصی مخزن (GitHub Secrets)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **فایل‌های تولید شده:**" >> $GITHUB_STEP_SUMMARY
          echo "  - \`SadaGir-CallRecorder-Signed-Release.apk\` (فایل نصبی مستقیم آماده نصب روی تمامی گوشی‌ها)" >> $GITHUB_STEP_SUMMARY
          echo "  - \`SadaGir-CallRecorder-Signed-Release.aab\` (بسته رسمی برای انتشار در گوگل‌پلی و کافه‌بازار)" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Signed APK & Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SadaGir-Android-Signed-Release
          path: output_artifacts/
          retention-days: 30
          if-no-files-found: error
